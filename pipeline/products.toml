# What this repository publishes: NOAA's Global Forecast System at 0.25
# degree — 10 m wind, 2 m and 850 hPa air temperature, sea-level pressure,
# 500 hPa height, total cloud and precipitation rate — from the open-data
# bucket `noaa-gfs-bdp-pds`, published, not drawn on the website's map (the
# owner, 2026-09-27): a second opinion beside the ECMWF layers. The fetcher
# is the site's `scripts/fetch-gfs.py` (eccodes, as the ECMWF fetcher).
#
# Global grids, 1440 x 721 from 90 N and 0 E, the lattice every global grid
# here uses; 4.6-9 MB a root, 41 MB a tree (measured 2026-09-27).
#
# **The budget.** Four cycles a day, f000 posted 3.6-3.8 h after its cycle
# and hourly steps to f120. Each run publishes the step nearest now, on an
# hourly schedule: under half an hour off when published, plus an hour to
# the next run and GitHub's lateness. 4 hours; re-measure after a week.
#
# **To the second host alone since 2026-11-08** (`r2_only`, the site
# pipeline's D13): no layer here is drawn on the website, so Pages carries
# this origin's status and nothing else.
#
# **Every product two days ahead and one behind, hourly, since 2026-11-21**
# (D4; the site pipeline's D16): `hours_ahead = 48`, `hours_behind = 24`. Each
# base lists the hours of its cycle to 48 ahead and the 24 behind that earlier
# runs published, every other hour a file named for its time
# (`<root>.v*.json`). The wind's and the two air temperatures' `frames` keep
# exactly the day either side they listed before (2026-11-08 to 11-21), and
# every hour past it is `moreFrames`': theirs from 25 to 48 ahead, and every
# hour of the other four, whose bases list no `frames`. **R2 keeps every
# dated file a base lists** (`memory = "r2-kept"`): those files never reach
# the `published` branch, and nothing is read back — the hours a run has
# published are read from its last base's listing, so NOAA is asked for the
# base's own hour and the hours its cycle had not given: two hours a run, a
# new cycle its 49. Some 3 GB on R2 with every window full (73 hours of a
# 41 MB tree). From 2026-11-08 to 11-21 the wind and air temperatures were
# remembered on R2 and read back each run with a read-only token
# (`memory = "r2"`, the site pipeline's D15); that token is no longer read.

[contract]
check = ["node", "scripts/test-schema.mjs"]
roots = ["node", "scripts/test-schema.mjs", "--roots"]

[defaults]
timeout_minutes = 20

# Named after the server. **Thirty minutes since 2026-11-21**: a new cycle
# reads its 49 hours of every product, 392 messages and 336 MB, which took
# 4 min 41 s end to end in the rehearsal of that afternoon on a laptop (the
# step alone 1 min 14 s on a runner the same hour for the 104 messages of the
# day either side); an hour on, 16 messages.
[steps.gfs]
cmd = ["python3", "scripts/fetch-gfs.py", "--only=wind-gfs,air-gfs,air850-gfs,mslp-gfs,hgt500-gfs,cloud-gfs,prate-gfs"]
lane = "noaa-gfs-bucket"
timeout_minutes = 30

[products.wind-gfs]
title = "GFS 10 m wind"
step = "gfs"
roots = ["wind-gfs.json"]
writes = ["wind-gfs.json", "wind-gfs.v*.json"]
r2_only = true
memory = "r2-kept"
hours_ahead = 48
hours_behind = 24
max_age_hours = 4
namespace = ["python3", "scripts/fetch-gfs.py", "--namespace", "--only=wind-gfs"]

[products.air-gfs]
title = "GFS 2 m air temperature"
